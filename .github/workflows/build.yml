name: Noor ZIP To APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Detect project
        id: detect
        shell: bash
        run: |
          set -e
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ] || [ -f gradlew ]; then
            echo "type=android" >> "$GITHUB_OUTPUT"
          elif [ -f pubspec.yaml ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
          elif [ -f package.json ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f index.html ]; then
            echo "type=web" >> "$GITHUB_OUTPUT"
          else
            echo "type=assets" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android project
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -e
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon
          fi

      - name: Set up Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Set up Node
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node project
        if: steps.detect.outputs.type == 'node'
        shell: bash
        run: |
          set -e
          npm install
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then npm run build; fi
          mkdir -p noor_web_dist
          if [ -d dist ]; then cp -a dist/. noor_web_dist/
          elif [ -d build ]; then cp -a build/. noor_web_dist/
          elif [ -f index.html ]; then cp -a . noor_web_dist/
          else cp -a . noor_web_dist/
          fi

      - name: Prepare Web/assets
        if: steps.detect.outputs.type == 'web' || steps.detect.outputs.type == 'assets'
        shell: bash
        run: |
          set -e
          mkdir -p noor_web_dist
          cp -a . noor_web_dist/
          find noor_web_dist -type d \( -name .git -o -name .github -o -name __pycache__ \) -prune -exec rm -rf {} + || true
          if [ ! -f noor_web_dist/index.html ]; then
            cat > noor_web_dist/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>noor</title>
          <style>
          *{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#eee;font-family:Arial,sans-serif}
          header{padding:28px 20px;background:#15151c;position:sticky;top:0}
          h1{margin:0 0 6px;font-size:24px}p{margin:0;color:#aaa}
          main{padding:18px;max-width:900px;margin:auto}.item{background:#15151c;border:1px solid #272733;border-radius:16px;padding:15px;margin:10px 0}
          a{color:#fff;text-decoration:none;font-weight:600;word-break:break-all}
          .meta{color:#888;font-size:12px;margin-top:7px}img{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px}
          audio{width:100%;margin-top:10px}.empty{padding:40px;text-align:center;color:#999}
          </style></head><body><header><h1>📦 noor</h1><p>Project files & assets</p></header><main>
          HTML
            find noor_web_dist -type f ! -path 'noor_web_dist/index.html' | sort | while read -r f; do
              rel="${f#noor_web_dist/}"
              safe=$(printf '%s' "$rel" | sed 's/&/\&amp;/g;s/</\&lt;/g;s/>/\&gt;/g;s/"/\&quot;/g')
              ext="${rel##*.}"
              case "$ext" in
                png|jpg|jpeg|gif|webp|svg)
                  printf '<div class="item"><a href="%s">🖼️ %s</a><img src="%s" loading="lazy"><div class="meta">%s</div></div>
' "$safe" "$safe" "$safe" "$ext" >> noor_web_dist/index.html ;;
                mp3|wav|ogg|m4a|aac|flac)
                  printf '<div class="item"><a href="%s">🎵 %s</a><audio controls src="%s"></audio><div class="meta">%s</div></div>
' "$safe" "$safe" "$safe" "$ext" >> noor_web_dist/index.html ;;
                *)
                  printf '<div class="item"><a href="%s">📄 %s</a><div class="meta">%s</div></div>
' "$safe" "$safe" "$ext" >> noor_web_dist/index.html ;;
              esac
            done
            echo '</main></body></html>' >> noor_web_dist/index.html
          fi

      - name: Create universal WebView APK
        if: steps.detect.outputs.type == 'node' || steps.detect.outputs.type == 'web' || steps.detect.outputs.type == 'assets'
        shell: bash
        run: |
          set -e
          rm -rf universal_apk
          mkdir -p universal_apk/app/src/main/java/com/noor/zipapk
          mkdir -p universal_apk/app/src/main/assets/project
          cp -a noor_web_dist/. universal_apk/app/src/main/assets/project/

          cat > universal_apk/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='NoorZipAPK'
          include ':app'
          EOF

          cat > universal_apk/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > universal_apk/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.noor.zipapk'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.noor.zipapk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          mkdir -p universal_apk/app/src/main/res/values
          cat > universal_apk/app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">noor</string></resources>
          EOF

          cat > universal_apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:navigationBarColor">#000000</item>
              <item name="android:statusBarColor">#000000</item>
            </style>
          </resources>
          EOF

          cat > universal_apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="@string/app_name" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > universal_apk/app/src/main/java/com/noor/zipapk/MainActivity.java <<'EOF'
          package com.noor.zipapk;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  WebView web = new WebView(this);
                  web.setWebViewClient(new WebViewClient());
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.loadUrl("file:///android_asset/project/index.html");
                  setContentView(web);
              }
          }
          EOF

          cd universal_apk
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK=$(find . -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          mkdir -p final
          cp "$APK" "final/noor.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-APK
          path: final/noor.apk
